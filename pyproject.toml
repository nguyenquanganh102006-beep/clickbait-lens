[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khdl-auto-labeler"
version = "0.2.0"
description = "Local LLM pseudo-labeling tool for the KHDL clickbait project"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.50,<2",
    "pandas>=2.2,<4",
    "openpyxl>=3.1,<4",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "google-genai>=2.31,<3",
    "pyarrow>=17,<27",
    "openai>=1.40,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
